; Rufi · plugin de sistema para Joomla 6 — textos del formulario (es-ES)
PLG_SYSTEM_RUFI="Sistema - Rufi"
PLG_SYSTEM_RUFI_XML_DESCRIPTION="Inserta la línea del cargador de Rufi (mascota de Reference Home) antes de &lt;/body&gt; en las páginas públicas configuradas. No modifica plantillas, artículos ni la base de datos: al desactivarlo o desinstalarlo las páginas quedan como estaban."
PLG_SYSTEM_RUFI_NOTE_SITE_LABEL="Solo en el sitio público"
PLG_SYSTEM_RUFI_NOTE_SITE_DESC="El plugin actúa únicamente en el sitio público: nunca en la administración (/administrator), la API (/api) ni la instalación. Tampoco en respuestas que no sean HTML, peticiones AJAX, format=raw o JSON, tmpl=component ni páginas de error. Solo se inserta en las páginas que tengan una configuración asignada abajo."
PLG_SYSTEM_RUFI_FIELD_ENABLED_LABEL="Insertar el cargador"
PLG_SYSTEM_RUFI_FIELD_ENABLED_DESC="Interruptor general del plugin. En «No» el plugin no toca ninguna página aunque esté activado en el gestor de plugins."
PLG_SYSTEM_RUFI_FIELD_LOADER_URL_LABEL="URL del cargador"
PLG_SYSTEM_RUFI_FIELD_LOADER_URL_DESC="Por defecto /rufi/rufi.js. Debe ser una ruta desde la raíz del sitio o una URL https del mismo origen o de un origen permitido, y terminar en .js. Si no es válida, no se inserta nada."
PLG_SYSTEM_RUFI_FIELD_ALLOWED_ORIGINS_LABEL="Orígenes permitidos para el cargador"
PLG_SYSTEM_RUFI_FIELD_ALLOWED_ORIGINS_DESC="Solo si la URL del cargador es absoluta y de otro dominio. Uno por línea, sin ruta (por ejemplo https://referencehome.es). Vacío: solo el mismo origen o rutas relativas."
PLG_SYSTEM_RUFI_FIELD_FALLBACK_LABEL="Páginas sin configuración asignada"
PLG_SYSTEM_RUFI_FIELD_FALLBACK_DESC="«No insertar» (recomendado): solo las páginas con configuración asignada cargan Rufi. «Cargador sin nombre»: inserta el cargador sin data-rufi-config en todas las páginas públicas y el cargador decide con configs/_routes.json."
PLG_SYSTEM_RUFI_FIELD_FALLBACK_NONE="No insertar"
PLG_SYSTEM_RUFI_FIELD_FALLBACK_ROUTES="Cargador sin nombre (usa _routes.json)"
PLG_SYSTEM_RUFI_FIELDSET_MAPPING="Páginas"
PLG_SYSTEM_RUFI_FIELD_URL_MAP_LABEL="Por URL"
PLG_SYSTEM_RUFI_FIELD_URL_MAP_DESC="Ruta tal como se ve en el navegador (sin dominio ni ?consulta) y nombre de la configuración (configs/&lt;nombre&gt;.json). «Prefijo» cubre la ruta y todo lo que cuelga de ella. Gana la primera regla que coincida y estas reglas van antes que las de menú."
PLG_SYSTEM_RUFI_FIELD_MATCH_LABEL="Coincidencia"
PLG_SYSTEM_RUFI_FIELD_MATCH_EXACT="Exacta"
PLG_SYSTEM_RUFI_FIELD_MATCH_PREFIX="Prefijo"
PLG_SYSTEM_RUFI_FIELD_PATH_LABEL="Ruta"
PLG_SYSTEM_RUFI_FIELD_CONFIG_LABEL="Configuración"
PLG_SYSTEM_RUFI_FIELD_MENU_MAP_LABEL="Por elemento de menú"
PLG_SYSTEM_RUFI_FIELD_MENU_MAP_DESC="Elemento de menú activo y nombre de la configuración. Solo minúsculas, números y guiones (máximo 64), como en el contrato de Rufi. Los nombres no válidos se ignoran."
PLG_SYSTEM_RUFI_FIELD_ITEMID_LABEL="Elemento de menú"
PLG_SYSTEM_RUFI_FIELD_EXCLUDED_LABEL="Rutas excluidas"
PLG_SYSTEM_RUFI_FIELD_EXCLUDED_DESC="Una por línea. Ninguna página en esa ruta o por debajo de ella carga Rufi, aunque tenga configuración. /administrator, /api y /installation están siempre excluidas."
