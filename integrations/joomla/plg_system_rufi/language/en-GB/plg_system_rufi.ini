; Rufi · system plugin for Joomla 6 — form strings (en-GB)
PLG_SYSTEM_RUFI="System - Rufi"
PLG_SYSTEM_RUFI_XML_DESCRIPTION="Inserts the Rufi loader line (Reference Home's mascot) before &lt;/body&gt; on the configured public pages. It does not modify templates, articles or the database: disabling or uninstalling it leaves pages as they were."
PLG_SYSTEM_RUFI_NOTE_SITE_LABEL="Public site only"
PLG_SYSTEM_RUFI_NOTE_SITE_DESC="The plugin only acts on the public site: never in the administrator (/administrator), the API (/api) or the installer. Nor on non-HTML responses, AJAX requests, format=raw or JSON, tmpl=component or error pages. It only inserts on pages with a configuration assigned below."
PLG_SYSTEM_RUFI_FIELD_ENABLED_LABEL="Insert the loader"
PLG_SYSTEM_RUFI_FIELD_ENABLED_DESC="Global switch. When set to No, the plugin leaves every page untouched even if it is enabled in the plugin manager."
PLG_SYSTEM_RUFI_FIELD_LOADER_URL_LABEL="Loader URL"
PLG_SYSTEM_RUFI_FIELD_LOADER_URL_DESC="Defaults to /rufi/rufi.js. Must be a root-relative path or an https URL of the same origin or of an allowed origin, ending in .js. If it is not valid, nothing is inserted."
PLG_SYSTEM_RUFI_FIELD_ALLOWED_ORIGINS_LABEL="Allowed loader origins"
PLG_SYSTEM_RUFI_FIELD_ALLOWED_ORIGINS_DESC="Only needed if the loader URL is absolute and on another domain. One per line, without a path (for example https://referencehome.es). Empty: same origin or relative paths only."
PLG_SYSTEM_RUFI_FIELD_FALLBACK_LABEL="Pages without an assigned configuration"
PLG_SYSTEM_RUFI_FIELD_FALLBACK_DESC="Do not insert (recommended): only pages with an assigned configuration load Rufi. Unnamed loader: inserts the loader without data-rufi-config on every public page and the loader decides using configs/_routes.json."
PLG_SYSTEM_RUFI_FIELD_FALLBACK_NONE="Do not insert"
PLG_SYSTEM_RUFI_FIELD_FALLBACK_ROUTES="Unnamed loader (uses _routes.json)"
PLG_SYSTEM_RUFI_FIELDSET_MAPPING="Pages"
PLG_SYSTEM_RUFI_FIELD_URL_MAP_LABEL="By URL"
PLG_SYSTEM_RUFI_FIELD_URL_MAP_DESC="Path as shown in the browser (no domain or ?query) and configuration name (configs/&lt;name&gt;.json). Prefix covers the path and everything below it. The first matching rule wins and these rules are checked before the menu rules."
PLG_SYSTEM_RUFI_FIELD_MATCH_LABEL="Match"
PLG_SYSTEM_RUFI_FIELD_MATCH_EXACT="Exact"
PLG_SYSTEM_RUFI_FIELD_MATCH_PREFIX="Prefix"
PLG_SYSTEM_RUFI_FIELD_PATH_LABEL="Path"
PLG_SYSTEM_RUFI_FIELD_CONFIG_LABEL="Configuration"
PLG_SYSTEM_RUFI_FIELD_MENU_MAP_LABEL="By menu item"
PLG_SYSTEM_RUFI_FIELD_MENU_MAP_DESC="Active menu item and configuration name. Lowercase letters, digits and hyphens only (max. 64), as in the Rufi contract. Invalid names are ignored."
PLG_SYSTEM_RUFI_FIELD_ITEMID_LABEL="Menu item"
PLG_SYSTEM_RUFI_FIELD_EXCLUDED_LABEL="Excluded paths"
PLG_SYSTEM_RUFI_FIELD_EXCLUDED_DESC="One per line. No page at or below that path loads Rufi, even with a configuration. /administrator, /api and /installation are always excluded."
